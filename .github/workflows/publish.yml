# Rebuilds the KPM index and its page on GitHub Pages from the releases of
# every repository in packages.txt. Runs when an app's release workflow
# starts it (workflow_dispatch, with a token that has only Actions write,
# so it can't change this repository), when main changes (for example a
# new line in packages.txt), or by hand. No schedule: GitHub turns off
# scheduled workflows in quiet repositories.
name: Publish the index

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Only logged: the index is always built from every release.
      repo:
        description: The app repository that released (owner/name)
        required: false
      tag:
        description: Its release tag
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Show what asked for this run
        if: inputs.repo != ''
        env:
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
        run: echo "Release $TAG of $REPO"

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/build-index.sh packages.txt pages/index.html \
            "${{ steps.pages.outputs.base_url }}/repo.json" site
          cat site/repo.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
